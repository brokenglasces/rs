<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <img class="avatar" id="avatar" alt="" hidden>
    <div>
      <a class="title" href="#/" id="siteTitle"></a>
      <p class="desc" id="siteDesc"></p>
    </div>
  </header>

  <nav class="bar">
    <button class="pg-btn" id="pgBtn" aria-expanded="false" aria-controls="drawer">
      <span id="pgLabel">archive</span><i class="chev" aria-hidden="true"></i>
    </button>
    <button class="player" id="player" aria-label="음악 재생" hidden>
      <span class="eq" aria-hidden="true"><b></b><b></b><b></b></span>
      <span class="track" id="trackName"></span>
    </button>
  </nav>

  <div class="drawer" id="drawer"><div><ul class="cats" id="cats"></ul></div></div>

  <main class="main" id="app"></main>
  <footer class="foot" id="foot"></footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

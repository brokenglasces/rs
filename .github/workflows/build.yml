name: build-posts
on:
  push:
    paths: ["posts/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "update posts.json" && git push)
